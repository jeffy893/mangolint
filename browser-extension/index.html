<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangoLint</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fdf6ec;
      color: #2d2a24;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.25rem;
      color: #b35c00;
    }

    .subtitle {
      color: #7a6a52;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 1rem;
      border: 2px solid #d4c4a8;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #b35c00;
    }

    button {
      margin-top: 1rem;
      padding: 0.75rem 1.75rem;
      background: #b35c00;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #934b00; }
    button:disabled { background: #c9a97a; cursor: not-allowed; }

    #output {
      margin-top: 2rem;
      line-height: 2;
      font-size: 1.1rem;
    }

    .word-wrapper {
      position: relative;
      display: inline;
    }

    .highlight {
      background: #ffe0a6;
      border-bottom: 2px solid #b35c00;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .highlight:hover { background: #ffd080; }

    .dropdown {
      display: none;
      position: absolute;
      left: 0;
      top: 100%;
      background: #fff;
      border: 1px solid #d4c4a8;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      padding: 0.5rem 0;
      z-index: 10;
      min-width: 220px;
      white-space: normal;
    }

    .dropdown.open { display: block; }

    .dropdown-item {
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.1s;
    }

    .dropdown-item:hover { background: #fdf0dc; }

    .replacement-word {
      font-weight: 600;
      color: #b35c00;
    }

    .replacement-lang {
      font-size: 0.8rem;
      color: #7a6a52;
    }

    .replacement-explanation {
      font-size: 0.8rem;
      color: #555;
      margin-top: 2px;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #d4c4a8;
      border-top-color: #b35c00;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-left: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #c0392b; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>MangoLint</h1>
  <p class="subtitle">Enrich your writing with Indigenous language words</p>

  <div class="container">
    <textarea id="userText" placeholder="Type or paste your text here...">My aunt likes to mash blueberries and ferment it into wine to make drinks for her big family parties</textarea>
    <button id="suggestBtn" onclick="suggest()">Suggest replacements</button>
    <div id="output"></div>
  </div>

  <script>
    async function suggest() {
      const text = document.getElementById("userText").value.trim();
      if (!text) return;

      const btn = document.getElementById("suggestBtn");
      const output = document.getElementById("output");

      btn.disabled = true;
      btn.innerHTML = 'Thinking<span class="spinner"></span>';
      output.innerHTML = "";

      try {
        const suggestions = await fetchSuggestions(text);
        renderSuggestions(text, suggestions);
      } catch (err) {
        output.innerHTML = `<p class="error">Error: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Suggest replacements";
      }
    }

    async function fetchSuggestions(text) {
      const res = await fetch("/suggest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      if (!res.ok) throw new Error(`API returned ${res.status}`);

      const data = await res.json();
      return data.suggestions || [];
    }

    function renderSuggestions(text, suggestions) {
      const output = document.getElementById("output");

      if (suggestions.length === 0) {
        output.innerHTML = "<p>No replacement suggestions for this text.</p>";
        return;
      }

      // Build a map: lowercase original -> suggestion data
      const suggestionMap = new Map();
      for (const s of suggestions) {
        const key = s.original.toLowerCase();
        if (!suggestionMap.has(key)) suggestionMap.set(key, []);
        suggestionMap.get(key).push(s);
      }

      // Split text into words while keeping whitespace/punctuation
      const tokens = text.split(/(\s+|(?=[.,!?;:])|(?<=[.,!?;:]))/);
      let html = "";

      for (const token of tokens) {
        const clean = token.replace(/[.,!?;:]/g, "").toLowerCase();
        if (suggestionMap.has(clean)) {
          const items = suggestionMap.get(clean);
          const id = "dd-" + Math.random().toString(36).slice(2, 8);
          let dropdownHtml = `<div class="dropdown" id="${id}">`;
          for (const item of items) {
            dropdownHtml += `
              <div class="dropdown-item" onclick="applyReplacement(this, '${id}', '${escapeAttr(item.replacement)}')">
                <div><span class="replacement-word">${esc(item.replacement)}</span> <span class="replacement-lang">(${esc(item.language)})</span></div>
                <div class="replacement-explanation">${esc(item.explanation)}</div>
              </div>`;
          }
          dropdownHtml += "</div>";
          html += `<span class="word-wrapper"><span class="highlight" onclick="toggleDropdown('${id}')">${esc(token)}</span>${dropdownHtml}</span>`;
        } else {
          html += esc(token);
        }
      }

      output.innerHTML = html;
    }

    function toggleDropdown(id) {
      // Close all other dropdowns
      document.querySelectorAll(".dropdown.open").forEach(d => {
        if (d.id !== id) d.classList.remove("open");
      });
      document.getElementById(id).classList.toggle("open");
    }

    function applyReplacement(el, dropdownId, replacement) {
      const wrapper = el.closest(".word-wrapper");
      const span = document.createElement("span");
      span.style.color = "#b35c00";
      span.style.fontWeight = "600";
      span.textContent = replacement;
      wrapper.replaceWith(span);
    }

    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    // Close dropdowns when clicking outside
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".word-wrapper")) {
        document.querySelectorAll(".dropdown.open").forEach(d => d.classList.remove("open"));
      }
    });
  </script>
</body>
</html>
