<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangolint - Cultural Linter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">Mangolint</h1>
            <p class="tagline">Cultural Context Linter</p>
        </header>
        
        <div class="main-content">
            <div class="editor-section">
                <!-- Brand Statement Section -->
                <div class="brand-statement-section" id="brandStatementSection" style="display: none;">
                    <div class="brand-statement-header">
                        <h3>✨ Enhanced Brand Statement</h3>
                        <button class="btn-copy" id="copyBrandBtn" title="Copy to clipboard">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            Copy
                        </button>
                    </div>
                    <div class="brand-statement-content" id="brandStatementContent">
                        <p class="loading">Generating enhanced description...</p>
                    </div>
                </div>
                
                <div class="editor-header">
                    <span class="editor-title">Text Editor</span>
                    <button class="btn-analyze" id="analyzeBtn">Analyze Text</button>
                </div>
                <div class="editor-wrapper">
                    <textarea 
                        id="textEditor" 
                        class="text-editor" 
                        placeholder="Start typing or paste your text here..."
                        spellcheck="false"
                    ></textarea>
                    <div id="highlightLayer" class="highlight-layer"></div>
                </div>
                <div class="editor-footer">
                    <span id="charCount">0 characters</span>
                    <span id="wordCount">0 words</span>
                </div>
            </div>
            
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Detected Cultural Entities</h2>
                </div>
                <div class="sidebar-content" id="entitiesPanel">
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                        <p>No entities detected yet</p>
                        <p class="empty-hint">Type or paste text and click "Analyze Text"</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
